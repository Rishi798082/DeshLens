services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: deshlens
      POSTGRES_USER: deshlens
      POSTGRES_PASSWORD: deshlens_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deshlens -d deshlens"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
